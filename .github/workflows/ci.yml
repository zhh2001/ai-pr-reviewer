name: CI

on:
  push:
    branches: [main]
  pull_request:

# 两个 job 没有 needs 关系，默认并行跑。
jobs:
  backend:
    name: backend (go build / vet / test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 跟 backend/go.mod 里的 go 1.22.x 对齐，避免本地与 CI 版本漂移。
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  frontend:
    name: frontend (npm ci / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # 有 lockfile 走 npm ci 拿到可复现依赖；没有时退回 install 让 PR 先把 lock 补上。
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run build
      - run: npm test
